name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Run unit tests
        run: cargo test --locked
      - name: Check this repository's documentation
        run: cargo run --release --locked --bin mdlink-audit -- --format github --fail-on-empty
      - name: Exercise the broken-then-fixed demo
        run: cargo run --locked --example demo

  quality:
    name: Formatting, lints and install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Fetch dependencies for the offline install
        run: cargo fetch --locked
      - name: Install and probe the three programs
        shell: bash
        run: bash scripts/smoke-install.sh

  action:
    name: Composite Action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit this repository through the Action
        uses: ./
        with:
          include-html: "true"
      - name: Prepare a broken HTML link in a path containing spaces
        shell: bash
        run: |
          root="$RUNNER_TEMP/mdlink action smoke"
          mkdir -p "$root"
          printf '# 中文指南\n' > "$root/guide.md"
          printf '<a href="guide.md#missing">Guide</a>\n' > "$root/README.md"
      - name: The Action must reject the broken link
        id: broken
        continue-on-error: true
        uses: ./
        with:
          root: ${{ runner.temp }}/mdlink action smoke
          include-html: "true"
      - name: Verify failure propagation
        if: steps.broken.outcome != 'failure'
        shell: bash
        run: |
          echo "The Action failed to reject a broken HTML link"
          exit 1
      - name: Correct the link
        shell: bash
        run: printf '<a href="guide.md#中文指南">Guide</a>\n' > "$RUNNER_TEMP/mdlink action smoke/README.md"
      - name: The Action must accept the corrected link
        uses: ./
        with:
          root: ${{ runner.temp }}/mdlink action smoke
          include-html: "true"
